<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audit Log Console — Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <div class="brand">
        <div class="brand-icon">🛡️</div>
        <h1>Audit Log Console</h1>
        <p>System & Compliance Administration</p>
      </div>

      <!-- Quick Demo Fill Helper -->
      <div class="quick-fill-bar">
        <span>Quick Demo:</span>
        <button type="button" class="chip-btn admin-chip" id="demoAdminBtn">Admin (ADM001)</button>
      </div>

      <form id="loginForm" autocomplete="off">
        <input type="hidden" id="activeRole" value="admin" />

        <div class="field">
          <label for="userIdentifier" id="idLabel">Admin ID / Email</label>
          <input
            type="text"
            id="userIdentifier"
            name="userIdentifier"
            placeholder="ADM001 or admin@company.com"
            required
            autofocus
          />
          <small class="hint" id="idHint">Authorized Administrator ID (e.g. ADM001 or admin@company.com)</small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              minlength="6"
              required
            />
            <button type="button" id="togglePwd" class="toggle-pwd" aria-label="Show password">👁</button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" />
            <span>Remember login</span>
          </label>
          <a href="#" class="forgot" onclick="alert('Contact Security Admin for password reset.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          Sign In to Audit Console
        </button>

        <div id="errorBox" class="error-box" role="alert"></div>
      </form>

      <div class="footer">
        <p>🔒 Audit Console access requires Administrator privileges.<br/>All access attempts are logged for security.</p>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
